name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  train-test-build:
    name: Train, test and build
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-train.txt

      # 1. Continuous training: reproducible PyCaret experiment + quality gate.
      #    The build fails here if hold-out R2 drops below the threshold.
      - name: Train model (PyCaret)
        run: python -m src.train

      - name: Show model metrics in job summary
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("models/metrics.json"))
          print("### Model metrics")
          print("| Metric | Value |")
          print("|---|---|")
          for key in ("model", "rows", "cv_r2", "holdout_r2", "holdout_mae", "holdout_rmse", "min_r2_gate"):
              print(f"| {key} | {m[key]} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json

      # 2. Automated tests (they need the model trained above)
      - name: Run tests
        run: python -m pytest -q

      # 3. Build the image with the freshly trained model baked in
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: estateiq:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Smoke test the container: it must predict AND serve the UI
      - name: Smoke test - prediction inside the container
        run: docker run --rm estateiq:ci python -m scripts.smoke_predict

      - name: Smoke test - health endpoint
        run: |
          docker run -d --name estateiq -p 8501:8501 estateiq:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo " -> app is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs estateiq
          exit 1

      # 5. Continuous delivery: publish the image to GitHub Container Registry
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha